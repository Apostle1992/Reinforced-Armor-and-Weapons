name: Build Reinforced Armor and Weapons

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract mod source
        run: unzip -q ReinforcedArmorWeapons-Fabric-1.21.1-USER-ARMOR-FIX.zip

      - name: Read mod version
        id: meta
        run: |
          VERSION=$(grep '^mod_version=' ReinforcedArmorWeapons-Fabric-1.21.1/gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build mod
        working-directory: ReinforcedArmorWeapons-Fabric-1.21.1
        run: gradle build --stacktrace

      - name: Prepare finished mod
        run: |
          mkdir -p dist
          VERSION="${{ steps.meta.outputs.version }}"
          JAR="ReinforcedArmorWeapons-Fabric-1.21.1/build/libs/reinforced-armor-weapons-${VERSION}.jar"
          test -f "$JAR"
          cp "$JAR" "dist/Reinforced-Armor-and-Weapons-${VERSION}-MC1.21.1.jar"

      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: Reinforced-Armor-and-Weapons-${{ steps.meta.outputs.version }}-MC1.21.1
          path: dist/Reinforced-Armor-and-Weapons-${{ steps.meta.outputs.version }}-MC1.21.1.jar
          if-no-files-found: error
